<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Посещаемость — Планетарий</title>
    <link rel="icon" type="image/png" href="images/favicon-inverted.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      (function () {
        var theme = localStorage.getItem("ids-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens/palette.css">
    <link rel="stylesheet" href="css/tokens/colors.css">
    <link rel="stylesheet" href="css/tokens/scales.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/page-composition/layout.css">
    <link rel="stylesheet" href="css/components/ids.css">
    <link rel="stylesheet" href="css/components/theme-toggle.css">
    <style>
      /* Квадратики впритык: без гэпов, без скруглений. */
      .sqviz {
        max-width: 56em;
      }
      .sqviz-row {
        display: grid;
        grid-template-columns: 11em 1fr;
      }
      .sqviz-label {
        align-self: center;
        padding-right: 1em;
        font-size: 0.85em;
        color: var(--ids__text-caption);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sqviz-sum .sqviz-label {
        color: var(--ids__text);
      }
      .sqviz-track {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
      }
      .sqviz-cell {
        aspect-ratio: 1 / 1;
      }
      .sqviz-cell:hover {
        outline: 1px solid var(--ids__text);
        outline-offset: -1px;
      }
      .sqviz-marks .sqviz-mark {
        font-size: 0.7em;
        line-height: 1.7;
        color: var(--ids__text-caption);
        white-space: nowrap;
        overflow: hidden;
        padding-right: 0.4em;
        box-sizing: border-box;
      }
      .sqviz-mark-pack {
        display: flex;
        justify-content: space-between;
        gap: 0.4em;
        overflow: visible;
        padding-right: 0;
      }
      .sqviz-num {
        text-align: center;
      }

      .sqviz-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1.4em;
        margin-top: 1em;
      }
      .sqviz-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
        font-size: 0.85em;
        color: var(--ids__text-caption);
      }
      .sqviz-legend-item i {
        width: 1em;
        height: 1em;
        flex: none;
      }
      .sqviz-info {
        min-height: 2.6em;
        margin-top: 1em;
        font-size: 0.9em;
        color: var(--ids__text-caption);
      }

      @media (width < 768px) {
        .sqviz-row {
          grid-template-columns: 7em 1fr;
        }
        .sqviz-label {
          font-size: 0.7em;
        }
      }
    </style>
  </head>

  <body class="ids">
    <header>
      <button class="ids__theme-toggle" role="switch" aria-checked="false" aria-label="Тёмная тема">
        <span class="ids__theme-toggle__track"><span class="ids__theme-toggle__thumb"></span></span>
      </button>
    </header>

    <main>
      <div class="ids__wrapper">
        <div class="section">
          <div class="ids__space XL"></div>
          <div class="ids__text-width">
            <p><a href="index.html">← Главная</a></p>
            <h1>Посещаемость</h1>
            <p>
              Строка — человек, квадратик — встреча. Синий — пришёл,
              зелёный — пришёл и показал демо. Верхняя строка — все
              строчки, наложенные друг на друга: чем темнее, тем больше
              людей; чем зеленее, тем больше демо.
            </p>
          </div>
          <div class="ids__space S"></div>
          <div id="plviz-attend"></div>
        </div>

        <div class="ids__space XL"></div>
      </div>
    </main>

    <script src="./js/theme-toggle.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/attendance.js"></script>
  </body>
</html>
