<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Дашборд — Планетарий</title>
    <link rel="icon" type="image/png" href="images/favicon-inverted.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      (function () {
        var theme = localStorage.getItem("ids-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens/palette.css">
    <link rel="stylesheet" href="css/tokens/colors.css">
    <link rel="stylesheet" href="css/tokens/scales.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/page-composition/layout.css">
    <link rel="stylesheet" href="css/components/ids.css">
    <link rel="stylesheet" href="css/components/theme-toggle.css">
    <style>
      .plviz-tip {
        position: fixed;
        z-index: 100;
        pointer-events: none;
        background: var(--ids__text);
        color: var(--ids__background);
        padding: 0.5em 0.7em;
        border-radius: 0.4em;
        font-size: 0.8em;
        line-height: 1.45;
        max-width: 22em;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .plviz-tip.visible {
        opacity: 1;
      }
      .plviz-scroll {
        overflow-x: auto;
      }
      .plviz-chart {
        display: grid;
        grid-template-rows: 2.2em;
        grid-auto-rows: var(--cell, 44px);
      }
      .plviz-name {
        position: sticky;
        left: 0;
        z-index: 2;
        padding-right: 1em;
        font-size: 1.15em;
        line-height: var(--cell, 44px);
        color: var(--ids__text-caption);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--ids__background);
      }
      .plviz-corner {
        z-index: 3;
      }
      .plviz-head .plviz-name {
        color: var(--ids__text);
      }
      .plviz-month {
        min-width: 0;
        font-size: 0.85em;
        line-height: 2.4;
        color: var(--ids__text-caption);
        padding-left: 0.15em;
        white-space: nowrap;
        overflow: hidden;
      }
      .plviz-cell {
        box-sizing: border-box;
      }
      .plviz-cell.sum-cell {
        position: relative;
      }
      .plviz-cell .sum {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.08;
      }
      .plviz-cell .sum.visit {
        background: var(--ids__link);
      }
      .plviz-cell .sum.demo {
        background: var(--ids__success);
      }
      .plviz-cell.visit {
        background: color-mix(in srgb, var(--ids__link) 28%, var(--ids__background));
      }
      .plviz-cell.demo {
        background: color-mix(in srgb, var(--ids__success) 32%, var(--ids__background));
      }
      .plviz-cell.visit:hover,
      .plviz-cell.demo:hover,
      .plviz-cell.sum-cell:hover {
        outline: 1px solid var(--ids__text);
        outline-offset: -1px;
        z-index: 1;
      }
      .plviz-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1.4em;
        margin-top: 1em;
        font-size: 1em;
        color: var(--ids__text-caption);
      }
      .plviz-legend span {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
      }
      .plviz-legend i {
        width: 1.4em;
        height: 1.4em;
        flex: none;
      }
      .plviz-legend .visit {
        background: color-mix(in srgb, var(--ids__link) 28%, var(--ids__background));
      }
      .plviz-legend .demo {
        background: color-mix(in srgb, var(--ids__success) 32%, var(--ids__background));
      }
      @media (width < 768px) {
        .plviz-name {
          font-size: 0.9em;
        }
      }
    </style>
  </head>

  <body class="ids">
    <header>
      <button class="ids__theme-toggle" role="switch" aria-checked="false" aria-label="Тёмная тема">
        <span class="ids__theme-toggle__track"><span class="ids__theme-toggle__thumb"></span></span>
      </button>
    </header>

    <main>
      <div class="ids__wrapper XL">
        <div class="section">
          <div class="ids__space XL"></div>
          <div class="ids__text-width">
            <p><a href="index.html">← Главная</a></p>
            <h1>Дашборд</h1>
            <p>
              Строка — человек, квадратик — встреча. Голубой — был, зелёный — показывал.
              Данные — с декабря 2025.
            </p>
          </div>
          <div class="ids__space S"></div>
          <div class="plviz-scroll">
            <div id="plviz-dashboard"></div>
          </div>
        </div>

        <div class="ids__space XL"></div>
      </div>
    </main>

    <script src="./js/theme-toggle.js"></script>
    <script src="./js/db.js?v=2026-09-10"></script>
    <script src="./js/dashboard.js?v=2026-08-27"></script>
  </body>
</html>
