<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Дашборд — Планетарий</title>
    <link rel="icon" type="image/png" href="images/favicon-inverted.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      (function () {
        var theme = localStorage.getItem("ids-theme");
        if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="css/tokens/palette.css?v=2026-09-10">
    <link rel="stylesheet" href="css/tokens/colors.css">
    <link rel="stylesheet" href="css/tokens/scales.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/page-composition/layout.css">
    <link rel="stylesheet" href="css/components/ids.css">
    <link rel="stylesheet" href="css/components/theme-toggle.css">
    <style>
      header {
        padding: 0;
      }
      .ids__wrapper.L {
        padding-top: 3rem;
      }
      .plviz-shell {
        --plviz-bar-row: 2.2rem;
        --plviz-row: calc(2.2rem / 3);
        --plviz-sum: calc(var(--plviz-row) * 2);
        --plviz-dates: 1.9rem;
        --plviz-sidebar: 10rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--plviz-sidebar);
        gap: var(--ids__gap-l);
        align-items: start;
        min-width: 0;
        width: 100%;
        font-size: 0.7rem;
        line-height: 1.25;
      }
      .plviz-board {
        min-width: 0;
      }
      #plviz-dashboard {
        min-width: 0;
      }
      aside.plviz-panel {
        position: sticky;
        top: 3rem;
        width: var(--plviz-sidebar);
        box-sizing: border-box;
        background: color-mix(in srgb, var(--ids__surface) 50%, var(--ids__background));
      }
      .plviz-panel-title {
        margin: 0 0 0.7em;
        font-weight: 600;
      }
      .plviz-field {
        margin: 0 0 0.7em;
      }
      .plviz-field-label {
        color: var(--ids__text-caption);
      }
      .plviz-field-value {
        margin: 0;
      }
      .plviz-panel-note {
        margin: 0.7em 0 0;
        color: var(--ids__text-caption);
      }
      .plviz-chart {
        position: relative;
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        --bars: calc(var(--bar-mins, 0) * var(--plviz-bar-row) * 4 / 60);
      }
      .plviz-timeline,
      .plviz-bars,
      .plviz-summary-grid,
      .plviz-grid {
        display: grid;
        width: 100%;
        min-width: 0;
        grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr));
      }
      .plviz-timeline {
        grid-template-rows: var(--plviz-dates);
        border-top: 1px solid var(--ids__text);
        padding-top: 0.2em;
      }
      .plviz-bars {
        grid-template-rows: var(--bars);
      }
      .plviz-summary,
      .plviz-matrix {
        position: relative;
        min-width: 0;
      }
      .plviz-summary-grid {
        grid-template-rows: var(--plviz-sum);
      }
      .plviz-grid {
        grid-auto-rows: var(--plviz-row);
      }
      .plviz-summary .plviz-name {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 3;
        pointer-events: none;
        display: flex;
        align-items: center;
      }
      .plviz-names {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 3;
        display: grid;
        grid-auto-rows: var(--plviz-row);
        pointer-events: none;
      }
      .plviz-name {
        width: max-content;
        max-width: 12em;
        padding-right: 0.8em;
        line-height: 1;
        color: var(--ids__text-caption);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        align-self: center;
      }
      .plviz-name-all {
        color: var(--ids__text);
      }
      .plviz-date {
        position: relative;
        min-width: 0;
        overflow: visible;
        line-height: 1.15;
        padding-left: 0.1em;
        white-space: nowrap;
      }
      .plviz-date.has-month {
        z-index: 1;
      }
      .plviz-date-month {
        display: block;
      }
      .plviz-bar {
        display: flex;
        flex-direction: column-reverse;
        justify-content: flex-start;
        align-self: end;
        width: 100%;
        box-sizing: border-box;
      }
      .plviz-seg {
        display: block;
        width: 100%;
        flex: none;
        box-sizing: border-box;
      }
      .plviz-seg.talk {
        background: var(--ids__color-blue-400);
      }
      .plviz-seg.demo {
        background: var(--ids__color-green-400);
      }
      .plviz-cell {
        box-sizing: border-box;
      }
      .plviz-cell.sum-cell {
        position: relative;
      }
      .plviz-cell .sum {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.08;
      }
      .plviz-cell .sum.visit {
        background: var(--ids__color-blue-400);
      }
      .plviz-cell .sum.demo {
        background: var(--ids__color-green-400);
      }
      .plviz-cell.visit {
        background: color-mix(in srgb, var(--ids__color-blue-400) 14%, var(--ids__background));
      }
      .plviz-cell.demo {
        background: color-mix(in srgb, var(--ids__color-green-400) 16%, var(--ids__background));
      }
      .plviz-seg:hover,
      .plviz-cell.visit:hover,
      .plviz-cell.demo:hover,
      .plviz-cell.sum-cell:hover {
        filter: brightness(1.1);
      }
      .plviz-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em 1.4em;
        max-width: 100%;
        margin-top: 1em;
        box-sizing: border-box;
        color: var(--ids__text-caption);
      }
      .plviz-legend span {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
      }
      .plviz-legend i {
        width: 1.4em;
        height: 1.4em;
        flex: none;
      }
      .plviz-legend .visit {
        background: color-mix(in srgb, var(--ids__color-blue-400) 14%, var(--ids__background));
      }
      .plviz-legend .demo {
        background: color-mix(in srgb, var(--ids__color-green-400) 16%, var(--ids__background));
      }
      @media (width < 768px) {
        .plviz-shell {
          grid-template-columns: minmax(0, 1fr);
        }
        aside.plviz-panel {
          position: static;
          width: auto;
          padding-top: 1em;
        }
      }
    </style>
  </head>

  <body class="ids">
    <header>
      <button class="ids__theme-toggle" role="switch" aria-checked="false" aria-label="Тёмная тема">
        <span class="ids__theme-toggle__track"><span class="ids__theme-toggle__thumb"></span></span>
      </button>
    </header>

    <main>
      <div class="ids__wrapper L">
        <div class="section">
          <div class="plviz-shell">
            <div class="plviz-board">
              <div id="plviz-dashboard"></div>
            </div>
            <aside class="plviz-panel" id="plviz-panel"></aside>
          </div>
          <div class="ids__space XL"></div>
        </div>
      </div>
    </main>

    <script src="./js/theme-toggle.js"></script>
    <script src="./js/db.js?v=2026-09-15g"></script>
    <script src="./js/dashboard.js?v=2026-09-15i"></script>
  </body>
</html>
